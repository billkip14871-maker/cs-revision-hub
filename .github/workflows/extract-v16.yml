name: Extract CS Revision Hub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o CS_Revision_Hub_v16.zip -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm -f CS_Revision_Hub_v16.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Install CS Revision Hub v16"
          git push
